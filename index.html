	<style>
	.grilla-portadas {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
		gap: 1.5rem;
		padding: 1.5rem 0 2rem;
	}
	.tarjeta-portada {
		position: relative;
		cursor: pointer;
		-webkit-tap-highlight-color: transparent;
	}
	.tarjeta-portada img {
		width: 100%;
		aspect-ratio: 2 / 3;
		object-fit: cover;
		display: block;
		transition: filter 0.25s ease;
	}
	@media (hover: hover) {
		.tarjeta-portada:hover img {
			filter: brightness(0.35);
		}
		.tarjeta-portada:hover .tarjeta-hover {
			opacity: 1;
		}
	}

	.tarjeta-hover {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		justify-content: flex-end;
		padding: 1rem 0.7rem 0.7rem;
		opacity: 0;
		transition: opacity 0.25s ease;
		pointer-events: none;
		z-index: 2;

<!-- ═══════════════════════════════════════════════════
     MOTOR — no tocar
     ═══════════════════════════════════════════════════ -->
<script>
(function () {

  /* ── 1. Parser YAML mínimo ── */
  function parseYAML(block) {
    var obj = {};
    block.split('\n').forEach(function (line) {
      var m = line.match(/^([^:#]+):\s*"?(.*?)"?\s*$/);
      if (m) obj[m[1].trim()] = m[2].trim();
    });
    return obj;
  }

  /* ── 2. Construir grilla genérica ── */
  function construirGrilla(grilla, lotes, buildHref) {
    lotes.forEach(function (l) {
      var img = l.imagen;
      var href        = buildHref(l);
      var titulo      = l.titulo + (l.autor ? ' — ' + l.autor : '') + (l.ano_publicacion ? ' (' + l.ano_publicacion + ')' : '');
      var tituloHover = l.titulo + (l.ano_publicacion ? ' (' + l.ano_publicacion + ')' : '');

      var div = document.createElement('div');
      div.className  = 'tarjeta-portada';
      div.id         = 'lote-' + l.lote;
      div.tabIndex   = 0;
      div.setAttribute('role', 'button');
      div.dataset.lote     = l.lote;
      div.dataset.titulo   = titulo;
      div.dataset.extracto = l.extracto;
      div.dataset.href     = href;
      div.dataset.imgSrc   = 'destilados/img/' + img;

      div.innerHTML =
        '<img src="destilados/img/' + img + '" alt="' + l.titulo + '" loading="lazy">' +
        '<div class="tarjeta-hover" aria-hidden="true">' +
          '<p class="tarjeta-hover-titulo">' + tituloHover + '</p>' +
          '<p class="tarjeta-hover-extracto">' + l.extracto + '</p>' +
        '</div>';

      grilla.appendChild(div);
    });
  }

  /* ── 3. Grilla principal ── */
  var rawPrincipal = document.getElementById('catalogo-principal').textContent;
  var lotesPrincipal = rawPrincipal.split('---').map(function (b) { return b.trim(); }).filter(Boolean)
    .map(parseYAML).filter(function (o) { return o.slug; });
  var grillaPrincipal = document.getElementById('grilla');
	lotesPrincipal.forEach(function (l) {
  l.imagen = l.imagen || (l.slug + '_presentacion_1_half.jpg');
});
  construirGrilla(grillaPrincipal, lotesPrincipal, function (l) {
    return 'destilados/' + l.slug + '.html';
  });

  /* ── 4. Grilla en proceso ── */
  var rawProceso = document.getElementById('catalogo-en-proceso').textContent;
  var lotesProceso = rawProceso.split('---').map(function (b) { return b.trim(); }).filter(Boolean)
    .map(parseYAML).filter(function (o) { return o.slug; });
  var grillaProceso = document.getElementById('grilla-proceso');
	lotesProceso.forEach(function (l) {
  l.imagen = l.imagen || 'catalogo-en-proceso_presentacion_1_half.jpg';
});
  construirGrilla(grillaProceso, lotesProceso, function (l) {
    return 'https://osmancitov.github.io/destilados/page.html?s=' + l.slug;
  });

  /* ── 5. Lightbox unificado con panel de info ── */
  var lbOverlay  = document.getElementById('lb-overlay');
  var lbImg      = document.getElementById('lb-img');
  var lbLote     = document.getElementById('lb-lote');
  var lbTitulo   = document.getElementById('lb-titulo');
  var lbExtracto = document.getElementById('lb-extracto');
  var lbPanel    = document.getElementById('lb-panel');

  function abrirLightbox(t) {
    lbImg.src          = t.dataset.imgSrc;
    lbImg.alt          = t.dataset.titulo;
    lbLote.textContent     = t.dataset.lote ? 'Lote ' + t.dataset.lote : '';
    lbTitulo.textContent   = t.dataset.titulo;
    lbExtracto.textContent = t.dataset.extracto;
    lbPanel.href           = t.dataset.href;
    lbOverlay.classList.add('activo');
    document.body.style.overflow = 'hidden';
  }

  function cerrarLightbox() {
    lbOverlay.classList.remove('activo');
    lbImg.src = '';
    document.body.style.overflow = '';
  }

  /* click en imagen o fondo → cerrar; click en panel → no cerrar */
  lbOverlay.addEventListener('click', function (e) {
    if (!e.target.closest('#lb-panel')) cerrarLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lbOverlay.classList.contains('activo')) cerrarLightbox();
  });

  /* ── 6. Click en tarjetas → lightbox unificado ── */
  function manejarClick(e) {
    var t = e.target.closest('.tarjeta-portada');
    if (t) abrirLightbox(t);
  }

  function manejarTeclado(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      var t = e.target.closest('.tarjeta-portada');
      if (t) { e.preventDefault(); abrirLightbox(t); }
    }
  }

  grillaPrincipal.addEventListener('click', manejarClick);
  grillaProceso.addEventListener('click', manejarClick);
  grillaPrincipal.addEventListener('keydown', manejarTeclado);
  grillaProceso.addEventListener('keydown', manejarTeclado);

})();
</script>

<!-- Excluir imágenes de presentación del lightbox -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('img[data-no-lightbox]').forEach(function (img) {
    img.style.cursor = '';
    img.addEventListener('click', function (e) {
      e.stopImmediatePropagation();
    }, true);
  });
});
</script>

</body>
