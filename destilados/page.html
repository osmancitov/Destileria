<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title id="meta-title">Destilería Osmancito</title>

  <link id="maestro" rel="stylesheet" href="stl/260529_i.css">
  <link id="complemento" rel="stylesheet" href="stl/260529_ii.css">

  <link rel="shortcut icon" type="image/x-icon" href="https://osmancitov.github.io/destilados/img/icon_amanita.ico">
  <link rel="icon" type="image/x-icon" href="https://osmancitov.github.io/destilados/img/icon_amanita.ico">
  <link rel="apple-touch-icon" href="https://osmancitov.github.io/destilados/img/icon_amanita.ico">

  <meta id="meta-description" name="description" content="">
  <meta name="author" content="Osmancito">
  <meta id="og-type" property="og:type" content="website" />
  <meta id="og-title" property="og:title" content="" />
  <meta id="og-description" property="og:description" content="" />
  <meta id="og-url" property="og:url" content="" />
  <meta property="og:site_name" content="Destilería Osmancito" />
  <meta id="og-image" property="og:image" content="" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta id="og-image-w" property="og:image:width" content="" />
  <meta id="og-image-h" property="og:image:height" content="" />
  <meta name="twitter:card" content="summary_large_image">
  <meta id="tw-title" name="twitter:title" content="">
  <meta id="tw-description" name="twitter:description" content="">
  <meta id="tw-image" name="twitter:image" content="">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    #page-error { display: none; color: red; padding: 2rem; }
  </style>
</head>
<body>

<!-- CABECERA -->
<header class="cabecera-documento">
  <div class="sello">Destilería Osmancito · Análisis completo</div>
  <h1 class="titulo-obra" id="hdr-titulo"></h1>
  <div class="autor" id="hdr-autor"></div>
  <div class="meta" id="hdr-meta"></div>
</header>

<!-- TOC superior -->
<nav id="toc" style="display:none">
  <p class="toc-titulo">Contenido</p>
  <ul id="toc-list"></ul>
</nav>

<!-- CUERPO -->
<main id="page-body"></main>

<p id="page-error">No se pudo cargar el documento.</p>

<!-- LightBox -->
<div id="lb-overlay" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
  <img id="lb-img" src="" alt="">
</div>

<script>
(function () {
  'use strict';

  /* ── 1. Slug ── */
  var params = new URLSearchParams(location.search);
  var slug   = params.get('s');

  if (!slug) { showError('Falta el parámetro ?s=slug en la URL.'); return; }

  /* ── 2. Fetch ── */
  fetch('https://raw.githubusercontent.com/osmancitov/osmancitov.github.io/refs/heads/main/destilados/' + slug + '.md')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (raw) {
      var parsed = parseFrontMatter(raw);
      applyMeta(parsed.meta, slug);
      renderBody(parsed.body, parsed.meta);
      /* ── Inicializar JS después de que el DOM esté listo ── */
      initProgreso();
      initDrawer();
      initLightbox();
    })
    .catch(function () {
      showError('No se encontró el documento «' + slug + '.md».');
    });

  /* ── 3. Front matter ── */
  function parseFrontMatter(text) {
    var meta = {};
    var body = text;
    if (text.startsWith('---')) {
      var end = text.indexOf('\n---', 3);
      if (end !== -1) {
        var yamlBlock = text.slice(4, end);
        body = text.slice(end + 4).trimStart();
        yamlBlock.split('\n').forEach(function (line) {
          var sep = line.indexOf(':');
          if (sep === -1) return;
          var key = line.slice(0, sep).trim();
          var val = line.slice(sep + 1).trim().replace(/^["']|["']$/g, '');
          meta[key] = val;
        });
      }
    }
    return { meta: meta, body: body };
  }

  /* ── 4. Meta tags ── */
  function applyMeta(m, slug) {
    var titulo = m.titulo || slug;
    var full   = titulo + ' — Destilería Osmancito';
    var base   = 'https://osmancitov.github.io/destilados/';
    var img    = base + 'img/' + slug + '_presentacion_1.jpg';
    document.title = full;
    setAttr('meta-description', 'content', m.descripcion || '');
    setAttr('og-title',         'content', full);
    setAttr('og-description',   'content', m.descripcion || '');
    setAttr('og-url',           'content', base + slug + '.html');
    setAttr('og-image',         'content', img);
    setAttr('og-image-w',       'content', m.imagen_w || '');
    setAttr('og-image-h',       'content', m.imagen_h || '');
    setAttr('tw-title',         'content', full);
    setAttr('tw-description',   'content', m.descripcion || '');
    setAttr('tw-image',         'content', img);
  }

  /* ── 5. Render ── */
  function renderBody(mdBody, m) {
    setText('hdr-titulo', m.titulo || '');
    setText('hdr-autor',  m.autor  || '');
    var metaParts = [];
    if (m.lote)       metaParts.push('Lote ' + m.lote);
    if (m.fecha_lote) metaParts.push(m.fecha_lote);
    setText('hdr-meta', metaParts.join(' · '));

    document.getElementById('page-body').innerHTML = marked.parse(mdBody);

    buildTOC();
  }

  /* ── 6. TOC superior: h1+h2 anidado como pandoc ── */
  function buildTOC() {
    var body     = document.getElementById('page-body');
    var headings = body.querySelectorAll('h1, h2');
    if (headings.length < 2) return;

    var list    = document.getElementById('toc-list');
    var lastLi  = null; /* último <li> de h1, para anidar h2 dentro */
    var subList = null;

    headings.forEach(function (h, i) {
      if (!h.id) h.id = 'sec-' + i;

      var a = document.createElement('a');
      a.href        = '#' + h.id;
      a.textContent = h.textContent;

      var li = document.createElement('li');
      li.appendChild(a);

      if (h.tagName === 'H1') {
        list.appendChild(li);
        lastLi  = li;
        subList = null;
      } else {
        /* h2 → anidar dentro del último h1 */
        if (!subList) {
          subList = document.createElement('ul');
          if (lastLi) lastLi.appendChild(subList);
          else list.appendChild(subList);
        }
        subList.appendChild(li);
      }
    });

    document.getElementById('toc').style.display = '';
  }

  /* ── 7. Barra de progreso ── */
  function initProgreso() {
    var barra = document.createElement('div');
    barra.id = 'barra-progreso';
    document.body.prepend(barra);
    function actualizar() {
      var scroll = window.scrollY || document.documentElement.scrollTop;
      var alto   = document.documentElement.scrollHeight - window.innerHeight;
      barra.style.width = (alto > 0 ? (scroll / alto) * 100 : 0).toFixed(2) + '%';
    }
    window.addEventListener('scroll', actualizar, { passive: true });
    actualizar();
  }

  /* ── 8. Drawer lateral (TOC solo h1) ── */
  function initDrawer() {
    var overlay = document.createElement('div');
    overlay.id  = 'do-overlay';
    document.body.appendChild(overlay);

    var drawer = document.createElement('div');
    drawer.id  = 'do-drawer';

    /* Herramientas */
    var herramientas = document.createElement('div');
    herramientas.id  = 'do-herramientas';

    /* Tema */
    var modoClaro = false;
    var btnTema   = document.createElement('button');
    btnTema.className   = 'do-btn';
    btnTema.textContent = '☀';
    btnTema.addEventListener('click', function () {
      modoClaro = !modoClaro;
      document.body.classList.toggle('modo-claro', modoClaro);
      btnTema.textContent = modoClaro ? '☽' : '☀';
      try { localStorage.setItem('do-tema', modoClaro ? 'claro' : 'oscuro'); } catch(e) {}
    });
    try {
      if (localStorage.getItem('do-tema') === 'claro') {
        modoClaro = true;
        document.body.classList.add('modo-claro');
        btnTema.textContent = '☽';
      }
    } catch(e) {}

    /* Fuente */
    var fuentes   = ['fuente-uno','fuente-dos','fuente-tres','fuente-cuatro','fuente-cinco'];
    var fuenteIdx = 0;
    var btnFuente = document.createElement('button');
    btnFuente.className   = 'do-btn';
    btnFuente.textContent = 'Aa';
    btnFuente.addEventListener('click', function () {
      document.body.classList.remove(fuentes[fuenteIdx]);
      fuenteIdx = (fuenteIdx + 1) % fuentes.length;
      document.body.classList.add(fuentes[fuenteIdx]);
      try { localStorage.setItem('do-fuente', fuenteIdx); } catch(e) {}
    });
    try {
      var gf = parseInt(localStorage.getItem('do-fuente'));
      if (!isNaN(gf) && gf > 0) { fuenteIdx = gf; document.body.classList.add(fuentes[fuenteIdx]); }
    } catch(e) {}

    /* Tamaño */
    var tamanos      = ['100%','90%','80%'];
    var tamanoLabels = ['A','A−','A--'];
    var tamanoIdx    = 0;
    var btnTamano    = document.createElement('button');
    btnTamano.className   = 'do-btn';
    btnTamano.textContent = tamanoLabels[0];
    function aplicarTamano(idx) {
      document.documentElement.style.fontSize = tamanos[idx];
      btnTamano.textContent = tamanoLabels[idx];
    }
    btnTamano.addEventListener('click', function () {
      tamanoIdx = (tamanoIdx + 1) % tamanos.length;
      aplicarTamano(tamanoIdx);
      try { localStorage.setItem('do-tamano', tamanoIdx); } catch(e) {}
    });
    try {
      var gt = parseInt(localStorage.getItem('do-tamano'));
      if (!isNaN(gt) && gt > 0) { tamanoIdx = gt; aplicarTamano(tamanoIdx); }
    } catch(e) {}

    herramientas.appendChild(btnTema);
    herramientas.appendChild(btnFuente);
    herramientas.appendChild(btnTamano);

    /* TOC drawer: solo h1 */
    var tocEl    = document.createElement('nav');
    tocEl.id     = 'do-toc';
    var body     = document.getElementById('page-body');
    var h1s      = body.querySelectorAll('h1');

    h1s.forEach(function (h, i) {
      if (!h.id) {
        h.id = 'seccion-' + i + '-' + h.textContent.trim()
          .toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
      }
      var a = document.createElement('a');
      a.href        = '#' + h.id;
      a.textContent = h.textContent.trim();
      a.addEventListener('click', function () { cerrar(); });
      tocEl.appendChild(a);
    });

    drawer.appendChild(herramientas);
    drawer.appendChild(tocEl);
    document.body.appendChild(drawer);

    /* Trigger */
    var trigger = document.createElement('button');
    trigger.id  = 'do-trigger';
    trigger.textContent = '⚙';
    trigger.setAttribute('aria-label', 'Abrir panel');
    document.body.appendChild(trigger);

    function abrir() { drawer.classList.add('abierto'); overlay.classList.add('activo'); }
    function cerrar() { drawer.classList.remove('abierto'); overlay.classList.remove('activo'); }

    trigger.addEventListener('click', function () {
      drawer.classList.contains('abierto') ? cerrar() : abrir();
    });
    overlay.addEventListener('click', cerrar);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });

    /* Activo por scroll */
    var enlaces = tocEl.querySelectorAll('a');
    if (h1s.length) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var id = entry.target.id;
            enlaces.forEach(function (a) { a.classList.remove('activo'); });
            var activo = tocEl.querySelector('a[href="#' + id + '"]');
            if (activo) activo.classList.add('activo');
          }
        });
      }, { rootMargin: '-10% 0px -80% 0px' });
      h1s.forEach(function (h) { observer.observe(h); });
    }
  }

  /* ── 9. Lightbox ── */
  function initLightbox() {
    var overlay = document.getElementById('lb-overlay');
    var lbImg   = document.getElementById('lb-img');

    document.querySelectorAll('.img-container img').forEach(function (img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        lbImg.src = img.src;
        lbImg.alt = img.alt;
        overlay.classList.add('activo');
        document.body.style.overflow = 'hidden';
      });
    });

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) {
        overlay.classList.remove('activo');
        document.body.style.overflow = '';
        lbImg.src = '';
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        overlay.classList.remove('activo');
        document.body.style.overflow = '';
        lbImg.src = '';
      }
    });
  }

  /* ── Helpers ── */
  function setText(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val;
  }
  function setAttr(id, attr, val) {
    var el = document.getElementById(id);
    if (el) el.setAttribute(attr, val);
  }
  function showError(msg) {
    var el = document.getElementById('page-error');
    if (el) { el.textContent = msg; el.style.display = ''; }
  }

})();
</script>

</body>
</html>
