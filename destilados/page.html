<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title id="meta-title">Destilería Osmancito</title>

  <link id="maestro" rel="stylesheet" href="stl/260529_i.css">
  <link id="complemento" rel="stylesheet" href="stl/260529_ii.css">
  <script src="js/260621_i.js"></script>
  <script src="js/260519_ii.js"></script>

  <link rel="shortcut icon" type="image/x-icon" href="https://osmancitov.github.io/destilados/img/icon_amanita.ico">
  <link rel="icon" type="image/x-icon" href="https://osmancitov.github.io/destilados/img/icon_amanita.ico">
  <link rel="apple-touch-icon" href="https://osmancitov.github.io/destilados/img/icon_amanita.ico">

  <!-- Meta tags actualizados dinámicamente -->
  <meta id="meta-description" name="description" content="">
  <meta name="author" content="Osmancito">
  <meta id="og-type" property="og:type" content="website" />
  <meta id="og-title" property="og:title" content="" />
  <meta id="og-description" property="og:description" content="" />
  <meta id="og-url" property="og:url" content="" />
  <meta property="og:site_name" content="Destilería Osmancito" />
  <meta id="og-image" property="og:image" content="" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta id="og-image-w" property="og:image:width" content="" />
  <meta id="og-image-h" property="og:image:height" content="" />
  <meta name="twitter:card" content="summary_large_image">
  <meta id="tw-title" name="twitter:title" content="">
  <meta id="tw-description" name="twitter:description" content="">
  <meta id="tw-image" name="twitter:image" content="">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    #page-loading { display: none; }
    #page-error   { display: none; color: red; padding: 2rem; }
  </style>
</head>
<body>

<!-- CABECERA -->
<header class="cabecera-documento">
  <div class="sello">Destilería Osmancito · Análisis completo</div>
  <h1 class="titulo-obra" id="hdr-titulo"></h1>
  <div class="autor" id="hdr-autor"></div>
  <div class="meta" id="hdr-meta"></div>
</header>

<!-- TOC -->
<nav id="toc" style="display:none">
  <p class="toc-titulo">Contenido</p>
  <ul id="toc-list"></ul>
</nav>

<!-- CUERPO -->
<main id="page-body"></main>

<p id="page-error">No se pudo cargar el documento.</p>

<!-- Módulo LightBox -->
<div id="lb-overlay" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
  <img id="lb-img" src="" alt="">
</div>

<script>
(function () {

  /* ── 1. Leer ?s= de la URL ── */
  const params = new URLSearchParams(location.search);
  const slug   = params.get('s');

  if (!slug) {
    showError('Falta el parámetro ?s=slug en la URL.');
    return;
  }

  /* ── 2. Cargar el .md ── */
  fetch(slug + '.md')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (raw) {
      var parsed = parseFrontMatter(raw);
      applyMeta(parsed.meta, slug);
      renderBody(parsed.body, parsed.meta);
    })
    .catch(function () {
      showError('No se encontró el documento «' + slug + '.md».');
    });

  /* ── 3. Parsear YAML front matter ── */
  function parseFrontMatter(text) {
    var meta = {};
    var body = text;

    if (text.startsWith('---')) {
      var end = text.indexOf('\n---', 3);
      if (end !== -1) {
        var yamlBlock = text.slice(4, end);
        body = text.slice(end + 4).trimStart();
        yamlBlock.split('\n').forEach(function (line) {
          var sep = line.indexOf(':');
          if (sep === -1) return;
          var key = line.slice(0, sep).trim();
          var val = line.slice(sep + 1).trim().replace(/^["']|["']$/g, '');
          meta[key] = val;
        });
      }
    }

    return { meta: meta, body: body };
  }

  /* ── 4. Actualizar <head> con las variables del YAML ── */
  function applyMeta(m, slug) {
    var titulo = m.titulo || slug;
    var full   = titulo + ' — Destilería Osmancito';
    var base   = 'https://osmancitov.github.io/destilados/';
    var img    = base + 'img/' + slug + '_presentacion_1.jpg';

    document.title = full;
    setText('meta-title', full);
    setAttr('meta-description',  'content', m.descripcion || '');
    setAttr('og-title',          'content', full);
    setAttr('og-description',    'content', m.descripcion || '');
    setAttr('og-url',            'content', base + slug + '.html');
    setAttr('og-image',          'content', img);
    setAttr('og-image-w',        'content', m.imagen_w || '');
    setAttr('og-image-h',        'content', m.imagen_h || '');
    setAttr('tw-title',          'content', full);
    setAttr('tw-description',    'content', m.descripcion || '');
    setAttr('tw-image',          'content', img);
  }

  /* ── 5. Rellenar cabecera y body ── */
  function renderBody(mdBody, m) {
    // Cabecera
    setText('hdr-titulo', m.titulo || '');
    setText('hdr-autor',  m.autor  || '');

    var metaParts = [];
    if (m.lote)       metaParts.push('Lote ' + m.lote);
    if (m.fecha_lote) metaParts.push(m.fecha_lote);
    setText('hdr-meta', metaParts.join(' · '));

    // Body
    var html = marked.parse(mdBody);
    document.getElementById('page-body').innerHTML = html;

    // TOC automático desde los headings del body
    buildTOC();
  }

  /* ── 6. Generar TOC ── */
  function buildTOC() {
    var headings = document.getElementById('page-body')
                           .querySelectorAll('h2, h3');
    if (headings.length < 2) return;

    var list = document.getElementById('toc-list');
    headings.forEach(function (h, i) {
      var id = 'sec-' + i;
      h.id = id;
      var li = document.createElement('li');
      li.className = h.tagName.toLowerCase();
      var a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
    });

    document.getElementById('toc').style.display = '';
  }

  /* ── Helpers ── */
  function setText(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val;
  }

  function setAttr(id, attr, val) {
    var el = document.getElementById(id);
    if (el) el.setAttribute(attr, val);
  }

  function showError(msg) {
    var el = document.getElementById('page-error');
    if (el) { el.textContent = msg; el.style.display = ''; }
  }

})();
</script>

</body>
</html>
