	.grilla-portadas {

		transition: filter 0.25s ease;

<script>
(function () {

  /* ── 1. Parser YAML mínimo ── */
  function parseYAML(block) {
    var obj = {};
    block.split('\n').forEach(function (line) {
      var m = line.match(/^([^:#]+):\s*"?(.*?)"?\s*$/);
      if (m) obj[m[1].trim()] = m[2].trim();
    });
    return obj;
  }

  /* ── 2. Leer catálogo ── */
  var raw = document.getElementById('catalogo').textContent;
  var bloques = raw.split('---').map(function (b) { return b.trim(); }).filter(Boolean);
  var lotes = bloques.map(parseYAML).filter(function (o) { return o.slug; });

  /* ── 3. Construir grilla ── */
  var grilla = document.getElementById('grilla');
  lotes.forEach(function (l) {
    var img    = l.imagen || (l.slug + '_presentacion_1_half.jpg');
    var href   = 'destilados/' + l.slug + '.html';
    var titulo = l.titulo + (l.autor ? ' — ' + l.autor : '') + (l.ano_publicacion ? ' (' + l.ano_publicacion + ')' : '');
    var tituloHover = l.titulo + (l.ano_publicacion ? ' (' + l.ano_publicacion + ')' : '');

    var div = document.createElement('div');
    div.className  = 'tarjeta-portada';
    div.id         = 'lote-' + l.lote;
    div.tabIndex   = 0;
    div.setAttribute('role', 'button');
    div.dataset.lote     = l.lote;
    div.dataset.titulo   = titulo;
    div.dataset.extracto = l.extracto;
    div.dataset.href     = href;

    div.innerHTML =
      '<img src="destilados/img/' + img + '" alt="' + l.titulo + '" loading="lazy">' +
      '<div class="tarjeta-hover" aria-hidden="true">' +
        '<p class="tarjeta-hover-titulo">' + tituloHover + '</p>' +
        '<p class="tarjeta-hover-extracto">' + l.extracto + '</p>' +
      '</div>';

    grilla.appendChild(div);
  });

  /* ── 4. Overlay ── */
  var fondo     = document.getElementById('ov-fondo');
  var elLote    = document.getElementById('ov-lote');
  var elTit     = document.getElementById('ov-titulo');
  var elExt     = document.getElementById('ov-extracto');
  var elLink    = document.getElementById('ov-enlace');
  var btnCerrar = document.getElementById('ov-cerrar');

  function abrir(t) {
    elLote.textContent = t.dataset.lote ? 'Lote ' + t.dataset.lote : '';
    elTit.textContent  = t.dataset.titulo;
    elExt.textContent  = t.dataset.extracto;
    elLink.href        = t.dataset.href;
    fondo.classList.add('activo');
    document.body.style.overflow = 'hidden';
  }

  function cerrar() {
    fondo.classList.remove('activo');
    document.body.style.overflow = '';
  }

  grilla.addEventListener('click', function (e) {
    var t = e.target.closest('.tarjeta-portada');
    if (t) abrir(t);
  });

  grilla.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      var t = e.target.closest('.tarjeta-portada');
      if (t) { e.preventDefault(); abrir(t); }
    }
  });

  btnCerrar.addEventListener('click', cerrar);
  fondo.addEventListener('click', function (e) { if (e.target === fondo) cerrar(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });

})();
</script>

</body>
</html>
